name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  state-schema:
    name: state schema + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install "jsonschema>=4.18"
      - name: Validate examples against migration-state.schema.json
        run: python framework/state/check_examples.py

  tools:
    name: tools acceptance tests (8 helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest "jsonschema>=4.18"
      - name: Run the tools test-suite (oracle 5/5 gate, journaling, attribution, ...)
        run: python -m pytest framework/tools/tests/ -v
      - name: Oracle judge-first self-test (the Stage 2 hard gate)
        run: python framework/tools/oracle.py self-test
