name: ci

on:
  push:
    branches: [main]
  pull_request:

# design/0001: no agent-specific packaging — CI pins both run models
# without LLM calls or a live GLV: the deterministic driver end-to-end
# against a stub agent, and the one-prompt chain (boot + verbatim brief)
# via --dry-run plus its FakeGlv acceptance suite in tests/test_succession.py.

jobs:
  json-and-links:
    name: JSON validity + internal markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every JSON file parses
        run: python scripts/check_json.py
      - name: Internal markdown links resolve
        run: python scripts/check_links.py

  citation-spot-check:
    name: citation URL spot-check (optional, non-blocking)
    # Best-effort HEAD check per the CI issue; continue-on-error keeps
    # bot-blocked/transient hosts from failing CI.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HEAD-check cited URLs
        # dfrws.org 403s automated checks (Cloudflare bot-block; pages verified
        # live 2026-10-27, #10); reddit 403s datacenter IPs (GitHub runners)
        # while serving residential requests fine.
        run: python scripts/check_links.py --external --allow-host dfrws.org --allow-host www.reddit.com

  state-schema:
    name: state schema + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install "jsonschema>=4.18"
      - name: Validate examples against migration-state.schema.json
        run: python framework/state/check_examples.py
      - name: Coherence-validate the worked example (state.py, stdlib-only)
        run: python framework/tools/state.py validate framework/examples/migration-state.json

  tools:
    name: tools acceptance tests (8 helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest "jsonschema>=4.18"
      - name: Run the tools test-suite (oracle 5/5 gate, journaling, attribution, ...)
        run: python -m pytest framework/tools/tests/ -v
      - name: Driver (single-process) acceptance run — start to finish, stub agent
        run: |
          python - <<'EOF'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          tmp = Path(tempfile.mkdtemp())
          proj = tmp / "acceptance-proj"
          (proj / "src" / "acceptance_proj").mkdir(parents=True)
          (proj / "src" / "acceptance_proj" / "__init__.py").write_text("")
          (proj / "pyproject.toml").write_text('[project]\nname = "acceptance-proj"\n')
          stub = tmp / "stub_agent.py"
          src = Path("framework/tools/tests/test_pipeline.py").read_text()
          stub.write_text(src.split("STUB_AGENT = '''")[1].split("'''")[0])
          cmd = (f"{sys.executable} {stub} "
                 f"{Path('framework/tools/state.py').resolve()} "
                 f"{{state}} {{stage}}")
          r = subprocess.run(
              [sys.executable, "framework/tools/pipeline.py", "run",
               "--target", str(proj), "--runs-dir", str(tmp / "runs"),
               "--agent-cmd", cmd],
              capture_output=True, text=True)
          out = json.loads(r.stdout)
          assert out["run_status"] == "complete", out
          assert out["terminal"] is True, out
          print("driver acceptance run:", out["summary"]["human"])
          EOF
      - name: One-prompt chain boot — dry-run brief from --target (no GLV)
        run: |
          python - <<'EOF'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          tmp = Path(tempfile.mkdtemp())
          proj = tmp / "prompt-proj"
          (proj / "src" / "prompt_proj").mkdir(parents=True)
          (proj / "src" / "prompt_proj" / "__init__.py").write_text("")
          (proj / "pyproject.toml").write_text('[project]\nname = "prompt-proj"\n')
          prompt = tmp / "my-prompt.md"
          prompt.write_text("Migrate prompt-proj per the framework prompt.\n")
          r = subprocess.run(
              [sys.executable, "framework/tools/succession.py", "chain",
               "--target", str(proj), "--runs-dir", str(tmp / "runs"),
               "--prompt-file", str(prompt), "--dry-run"],
              capture_output=True, text=True)
          out = json.loads(r.stdout)
          assert out["dry_run"] is True and out["next_session"] == 1, out
          # the next session's brief IS the user's prompt, byte for byte
          assert out["brief"] == prompt.read_text(), out["brief"]
          st = json.loads((tmp / "runs" / "prompt-proj" /
                           "migration-state.json").read_text())
          assert st["autonomy"]["level"] == "L2", st["autonomy"]
          print("one-prompt chain boot:", out["summary"]["human"])
          EOF
      - name: Oracle judge-first self-test (the Stage 2 hard gate)
        run: python framework/tools/oracle.py self-test
