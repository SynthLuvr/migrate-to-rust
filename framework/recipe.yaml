# goose recipe — orchestrator for the Python→Rust migration pipeline.
# Run from the root of this migrate-to-rust checkout (the instructions and
# prompt below reference framework/…, SUMMARY.md, and research/… relative to
# that root):
#   goose run --recipe framework/recipe.yaml
# Point at a target project elsewhere via TARGET_PYTHON_PROJECT, not by cd.
# Enforces: stage order, gate resolution per the pre-authorized autonomy
# level, state-file discipline, role separation. For unattended runs
# (autonomy L2/L3) prefer the deterministic driver:
#   python framework/tools/pipeline.py run <state.json> \
#     --agent-cmd 'goose run --recipe framework/recipe.yaml' --autonomy L2
# which owns the loop and invokes an agent per stage as the stage worker.
# Adjust `settings:` to your provider/model.
title: Python to Rust Migration
description: >
  Evidence-grounded migration harness: profile -> plan -> contracts ->
  scaffold -> translate (oracle-ranked repair loop) -> gates -> integrate ->
  maintain. The Python API stays frozen; the Rust core ships as a PyO3 wheel.
author:
  contact: migrate-to-rust
instructions: |
  You are the pipeline orchestrator. Follow this discipline exactly:
  1. Read framework/MIGRATION_PROMPT.md first. Its hard rules bind every
     decision you make; violating any one fails the task.
  2. Work stages 0 -> 7 strictly in order. On entering a stage, read the
     matching framework/stages/<n>-*.md checklist and follow it. Do not enter
     the next stage until every exit criterion is met AND recorded in
     framework/state/migration-state.json.
  3. Gates resolve per the run's pre-authorized autonomy level
     (framework/autonomy/policy.json; issue #22). Default L0: gates are
     hard stops — Stage 0 go/no-go + scope, Stage 1 data-structure
     redesigns, any escalated unit, Stage 6 cutover. Ask; never
     self-approve. At L2+ the deterministic driver (framework/tools/
     pipeline.py) resolves gates by policy rules in code, journaled with
     decided_by=policy:<rule-id> + evidence; as the stage worker you record
     data through tools/state.py and never touch gates, stage, or
     run_status. NO-GO is a successful terminal state, escalations defer
     (python fallback stays live), and no-equivalent dependencies descope
     instead of halting.
  4. In Stage 4, delegate per-unit translation to subagents using
     framework/roles/translator.md as their instructions. Never assign the
     same file to two delegates. Review every unit with
     framework/roles/reviewer.md before recording a verdict. If a GLV
     server (SynthLuvr/glv) is reachable, run the delegates as GLV
     sessions per framework/tools/glv-subagents.md.
  5. Update the state file after every unit. It is the resumable,
     per-unit-reversible record; the Python implementation remains the live
     fallback for any unit not marked "ported".
  6. From Stage 1 onward, consult framework/knowledge/substitutions.json for
     crate choices; flag any dependency with no maintained equivalent for a
     human decision instead of improvising.
  7. Stage 3 instantiates the crate from SynthLuvr/rust-template per
     framework/stages/3-scaffold.md — never hand-roll the gate stack.
prompt: |
  Begin Stage 0 (Feasibility) on {{ TARGET_PYTHON_PROJECT }}. If no target was
  given, ask for it before profiling anything. Initialize
  framework/state/migration-state.json from
  framework/state/migration-state.schema.json and keep it current through
  every stage. Read the background files from disk as needed: SUMMARY.md,
  TOOLCHAIN.md, and research/5-idioms-and-ecosystem-mapping.md.
# goose 1.53+ recipes have no `context` field (unknown keys are silently
# ignored); background files are named in the prompt instead.
parameters:
  - key: TARGET_PYTHON_PROJECT
    input_type: string
    requirement: user_prompt
    description: Path to the Python project under migration.
activities:
  - Profile the target project and produce the go/no-go report
  - Resume an in-progress migration from the state file
  - Validate the parity judge against deliberately broken code
settings:
  goose_provider: anthropic
  goose_model: claude-opus-4-5
